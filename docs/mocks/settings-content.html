<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定 中身案(全部入り)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", system-ui, sans-serif; background: #2a2a2e; color: #ccc; padding: 22px; }
  h1 { font-size: 15px; font-weight: 400; margin-bottom: 14px; }
  .row2 { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .col { text-align: center; }
  .ctag { font-size: 12px; opacity: .6; margin-bottom: 6px; }

  /* パネル(=ドロワー) */
  .panel { width: 330px; border-radius: 14px; padding: 22px 18px 24px; text-align: left;
    display: flex; flex-direction: column; }
  .panel.dark  { background: radial-gradient(120% 80% at 50% 0%, #32323f 0%, #1e1e27 72%);
    --text:#d8d4ca; --dim:#9d9a8e; --gold:#e8d9b0; --line:rgba(255,255,255,.08); --off:rgba(255,255,255,.14); --knob:#d8d4ca; --track: linear-gradient(160deg,#3a3a45,#2c2c37); }
  .panel.light { background: #fbf8f1;
    --text:#2b2620; --dim:#8a8276; --gold:#a8801f; --line:rgba(43,38,32,.10); --off:rgba(43,38,32,.18); --knob:#fff; --track:#e6decd; }

  .p-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
  .p-title { font-family:"Hiragino Mincho ProN",serif; font-size:19px; letter-spacing:.25em; color:var(--gold); }
  .p-close { color:var(--dim); font-size:20px; }
  .sec { font-size:11px; letter-spacing:.14em; color:var(--dim); margin: 16px 2px 2px; }
  .row { display:flex; align-items:center; justify-content:space-between; padding: 13px 2px; border-top:1px solid var(--line); gap: 12px; }
  .row .lbl { color:var(--text); font-size:14.5px; letter-spacing:.04em; }
  .row .val { color:var(--dim); font-size:13px; display:flex; align-items:center; gap:4px; }
  .chev, .ext { color:var(--dim); font-size:15px; }

  /* テーマ スライドトグル(縮小再現) */
  .tgl { position:relative; width:60px; height:28px; border-radius:14px; display:flex; align-items:center; justify-content:space-between; padding:0 5px;
    background:var(--track); border:1px solid var(--line); }
  .tgl .ic { width:15px; height:15px; }
  .tgl .w { width:22px; height:22px; display:grid; place-items:center; border-radius:50%; color:var(--dim); }
  .panel.dark  .tgl .moon { color:var(--gold); background:linear-gradient(160deg,#4a4a57,#3a3a45); }
  .panel.light .tgl .sun  { color:var(--gold); background:linear-gradient(160deg,#ddd5c4,#cfc6b2); }

  /* 標準スイッチ(効果音/触覚) */
  .sw { width:42px; height:25px; border-radius:13px; background:var(--off); position:relative; transition:background .2s; }
  .sw.on { background:var(--gold); }
  .sw .k { position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%; background:var(--knob); box-shadow:0 1px 2px rgba(0,0,0,.3); transition:left .2s; }
  .sw.on .k { left:19px; }
</style>
</head>
<body>
  <h1>設定 中身案（全部入り）— 左ダーク / 右ライト</h1>
  <div class="row2" id="root"></div>
  <script>
    const SUN='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MOON='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
    const themeTgl = `<span class="tgl"><span class="w sun">${SUN}</span><span class="w moon">${MOON}</span></span>`;
    const sw = (on)=>`<span class="sw ${on?'on':''}"><span class="k"></span></span>`;
    const sections = [
      ['表示', [
        ['テーマ', themeTgl],
        ['言語', `<span class="val">日本語 <span class="chev">›</span></span>`],
      ]],
      ['音・操作感', [
        ['効果音', sw(true)],
        ['触覚フィードバック', sw(false)],
      ]],
      ['データ', [
        ['進捗をリセット', `<span class="chev">›</span>`],
      ]],
      ['情報', [
        ['遊び方', `<span class="chev">›</span>`],
        ['このアプリについて', `<span class="val">v1.0 <span class="chev">›</span></span>`],
        ['プライバシーポリシー', `<span class="ext">↗</span>`],
        ['お問い合わせ', `<span class="ext">↗</span>`],
        ['レビューする', `<span class="ext">↗</span>`],
      ]],
      ['購入', [
        ['広告を消す', `<span class="chev">›</span>`],
        ['購入を復元', `<span class="chev">›</span>`],
      ]],
    ];
    const body = sections.map(([s,rows]) =>
      `<div class="sec">${s}</div>` + rows.map(([l,ctrl])=>`<div class="row"><span class="lbl">${l}</span>${ctrl}</div>`).join('')
    ).join('');
    const panel = (theme) => `<div class="panel ${theme}">
      <div class="p-head"><span class="p-title">設定</span><span class="p-close">✕</span></div>
      ${body}
    </div>`;
    document.getElementById('root').innerHTML =
      `<div class="col"><div class="ctag">ダーク(=A画面カード色)</div>${panel('dark')}</div>` +
      `<div class="col"><div class="ctag">ライト(=紙)</div>${panel('light')}</div>`;
  </script>
</body>
</html>
