<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>icon render (light best emblem)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f3efe6; }
  /* 512座標系で描画し、ビューポートに合わせて等倍スケール。box-shadow も一緒に縮む */
  .icon {
    position: absolute; left: 0; top: 0; width: 512px; height: 512px;
    transform-origin: top left; overflow: hidden;
    background: #f3efe6;
  }
  .halo {
    position: absolute; left: 96px; top: 116px; width: 320px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(216, 183, 95, 0.2), rgba(216, 183, 95, 0.07) 48%, transparent 76%);
    filter: blur(8px);
  }
  .disc {
    position: absolute; left: 91px; top: 276px; width: 330px; height: 132px;
    border-radius: 36px;
    background: radial-gradient(120% 150% at 40% 24%, #f7ecc8 0%, #e0c585 40%, #bd9c52 72%, #8f7032 100%);
    box-shadow: 0 18px 28px rgba(95, 76, 35, 0.14), inset 0 4px 7px rgba(255, 248, 224, 0.72), inset 0 -10px 18px rgba(115, 89, 36, 0.24);
  }
  .ball {
    position: absolute; width: 150px; height: 150px; border-radius: 22px;
    background: linear-gradient(145deg, #fafdff 0%, #9ecde3 52%, #669fbe 100%);
    box-shadow: inset 4px 4px 0 rgba(255,255,255,.46), inset -5px -5px 0 rgba(74,48,35,.14), 0 14px 24px rgba(92,62,45,.2);
  }
  .ball::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    border: 4px solid rgba(36,107,143,.5);
  }
  .ball::after {
    content: ""; position: absolute; left: 27%; top: 24%; width: 18%; height: 18%;
    border-radius: 50%; background: rgba(255,255,255,.55);
  }
  .eb1 { left: 132px; top: 210px; z-index: 2; }
  .eb2 { left: 226px; top: 156px; z-index: 1; }
</style>
</head>
<body>
  <div class="icon" id="icon">
    <div class="halo"></div>
    <div class="disc"></div>
    <div class="ball eb2"></div>
    <div class="ball eb1"></div>
  </div>
  <script>
    function fit() {
      var s = Math.min(window.innerWidth, window.innerHeight) / 512;
      document.getElementById('icon').style.transform = 'scale(' + s + ')';
    }
    fit();
    window.addEventListener('resize', fit);
  </script>
</body>
</html>
