<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定アイコン案</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", system-ui, sans-serif; padding: 24px; background: #2a2a2e; color: #ddd; }
  h1 { font-size: 15px; font-weight: 400; margin-bottom: 16px; }
  .stage { border-radius: 14px; padding: 24px 20px; margin-bottom: 16px; display: flex; gap: 34px; flex-wrap: wrap; align-items: flex-start; }
  .stage.dark  { background: radial-gradient(120% 100% at 50% 0%, #101018, #0a0a0e 60%); --dim:#9d9a8e;
    --board: radial-gradient(120% 120% at 50% 42%, #32323f 0%, #1e1e27 72%); --cb: rgba(255,255,255,.08); --hl: rgba(255,255,255,.10); }
  .stage.light { background: radial-gradient(120% 100% at 50% 0%, #fbf8f1, #f3efe6 60%); --dim:#8a8276;
    --board: linear-gradient(160deg, #ddd5c4 0%, #cfc6b2 100%); --cb: rgba(43,38,32,.10); --hl: rgba(255,255,255,.5); }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label { font-size: 11px; opacity: .85; text-align: center; line-height: 1.5; }
  .btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: var(--board); border: 1px solid var(--cb); box-shadow: inset 0 1px 0 var(--hl); }
  .btn svg { width: 18px; height: 18px; color: var(--dim); display: block; }
</style>
</head>
<body>
  <h1>設定アイコン案（戻ると対の盤色丸・32px・18pxグリフ）</h1>
  <div id="root"></div>
  <script>
    const S = (inner, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||1.8}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    const FILL = (inner) => `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">${inner}</svg>`;
    const icons = {
      gear: S('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>', 1.4),
      slidersV: S('<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>'),
      tuneH: S('<line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="17" x2="21" y2="17"/><circle cx="9" cy="7" r="2.3" fill="var(--board)"/><circle cx="15" cy="17" r="2.3" fill="var(--board)"/>'),
      dots: FILL('<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>'),
    };
    const items = [
      ['gear','案A 歯車<br>(王道の設定)'],
      ['slidersV','案B スライダー(縦)<br>(調整・細線向き)'],
      ['tuneH','案C スライダー(横)<br>(つまみ付き)'],
      ['dots','案D 三点(縦)<br>(その他/メニュー)'],
    ];
    const panel = (theme) => `<div class="stage ${theme}">${
      items.map(([k,l]) => `<div class="cell"><div class="btn">${icons[k]}</div><div class="label">${l}</div></div>`).join('')
    }</div>`;
    document.getElementById('root').innerHTML =
      '<div style="font-size:12px;opacity:.6;margin-bottom:6px">ダーク</div>' + panel('dark') +
      '<div style="font-size:12px;opacity:.6;margin-bottom:6px">ライト</div>' + panel('light');
  </script>
</body>
</html>
