<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遊び方 図解モック</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0e;
  color: #d8d4ca;
  font-family: "Hiragino Kaku Gothic ProN", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 20px 16px 60px;
}
h1 { font-size: 14px; text-align: center; color: #9d9a8e; font-weight: 400; margin-bottom: 24px; }
.block { max-width: 400px; margin: 0 auto 40px; }
.block-label { font-size: 11px; color: #e8d9b0; letter-spacing: 0.12em; margin-bottom: 4px; }
.block-title { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
.block-cap { font-size: 11px; color: #9d9a8e; text-align: center; margin-top: 8px; line-height: 1.5; }
hr { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 0 auto 40px; max-width: 400px; }

/* ---- 共通ミニ盤 ---- */
.mini-board {
  aspect-ratio: 1;
  background: radial-gradient(120% 120% at 50% 42%, #32323f 0%, #1e1e27 72%);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.11);
  box-shadow: inset 0 2px 7px rgba(0,0,0,0.45);
  position: relative;
  display: grid;
  overflow: hidden;
}
.g4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.c { border: 0.5px solid rgba(255,255,255,0.06); }
.w { background: linear-gradient(160deg, #4a4a57 0%, #3a3a45 100%); border-color: rgba(255,255,255,0.08); }
.b {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 40% 32%, #d4cbb8 0%, #a89f8c 60%, #7a7468 100%);
  box-shadow: 0 0 8px 2px rgba(240,220,170,0.35);
  transition: left 0.5s ease, top 0.5s ease;
}
.gl {
  position: absolute; border-radius: 50%;
  border: 2px solid rgba(240,220,170,0.35);
  background: radial-gradient(circle, rgba(240,220,170,0.06) 0%, transparent 70%);
}

/* ===== 01: 2盤＋同時移動アニメ ===== */
.fig01 {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  width: 55%; max-width: 180px; margin: 0 auto;
  position: relative;
}
.fig01 .mini-board { width: 100%; }
.fig01 .b { width: 28%; height: 28%; }
.fig01 .gl { width: 30%; height: 30%; }
/* 矢印インジケータ */
.dir-ind {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-size: 24px; color: rgba(232,217,176,0.6);
  z-index: 5; pointer-events: none;
  animation: dir-flash 3s ease infinite;
}
@keyframes dir-flash {
  0%, 25% { opacity: 0; }
  30% { opacity: 1; }
  45%, 100% { opacity: 0; }
}
/* 球のアニメ: 左→右→左 (3秒サイクル) */
.fig01 .b { animation: ball01 3s ease infinite; }
@keyframes ball01 {
  0%, 25%  { left: 3%;  top: 3%; }
  40%, 75% { left: 69%; top: 3%; }
  90%, 100% { left: 3%;  top: 3%; }
}

/* ===== 02: ○/×比較 ===== */
.fig02 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  width: 90%; max-width: 320px; margin: 0 auto;
}
.fig02-case { text-align: center; }
.fig02-label {
  font-size: 12px; margin-bottom: 6px; font-weight: 500;
}
.fig02-label.ok { color: #e8d9b0; }
.fig02-label.ng { color: #c85a50; }
.fig02-pair {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.fig02 .mini-board { width: 100%; }
.fig02 .b { width: 30%; height: 30%; }
.fig02 .gl { width: 32%; height: 32%; }

/* OK: 両方ゴール上 */
.fig02 .ok-board1 .b { left: 66%; top: 66%; }
.fig02 .ok-board1 .gl { left: 65%; top: 65%; }
.fig02 .ok-board2 .b { left: 3%; top: 66%; }
.fig02 .ok-board2 .gl { left: 2%; top: 65%; }
/* ゴール上にいる = 金の輪 */
.fig02 .ok-board1 .gl, .fig02 .ok-board2 .gl {
  border-color: rgba(232,217,176,0.7);
  box-shadow: 0 0 10px 3px rgba(240,220,170,0.3);
}

/* NG: 片方だけゴール上 */
.fig02 .ng-board1 .b { left: 66%; top: 66%; }
.fig02 .ng-board1 .gl { left: 65%; top: 65%; }
.fig02 .ng-board2 .b { left: 33%; top: 33%; } /* ゴールにいない */
.fig02 .ng-board2 .gl { left: 2%; top: 65%; }
/* 反則 = 赤み */
.fig02 .ng-board1 { box-shadow: inset 0 2px 7px rgba(0,0,0,0.45), inset 0 0 20px rgba(200,60,50,0.2); }
.fig02 .ng-board2 { box-shadow: inset 0 2px 7px rgba(0,0,0,0.45), inset 0 0 20px rgba(200,60,50,0.2); }

/* ===== 03: ズレ発生ステップ ===== */
.fig03 {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center;
  width: 95%; max-width: 360px; margin: 0 auto;
}
.fig03-step { text-align: center; }
.fig03-step-label { font-size: 10px; color: #9d9a8e; margin-bottom: 4px; }
.fig03-arrow { font-size: 20px; color: rgba(232,217,176,0.4); padding-top: 14px; }
.fig03-pair {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.fig03 .mini-board { width: 100%; }
.fig03 .b { width: 30%; height: 30%; }
/* コマ1: 両球とも左上 */
.fig03 .step1-b1 .b { left: 3%; top: 3%; }
.fig03 .step1-b2 .b { left: 3%; top: 3%; }
/* コマ2: →で右へ。部屋1は壁で止まる、部屋2は右端へ */
.fig03 .step2-b1 .b { left: 3%; top: 3%; } /* 壁で止まった! */
.fig03 .step2-b2 .b { left: 66%; top: 3%; } /* 動いた */
/* 壁で止まった強調: 金の光 */
.fig03 .step2-b1 .bump-mark {
  position: absolute;
  width: 3px; height: 30%; top: 3%; left: 35%;
  background: #f0dfa0;
  box-shadow: 0 0 8px 2px rgba(216,192,110,0.5);
  border-radius: 2px;
  animation: bump-pulse 1.5s ease-in-out infinite;
}
@keyframes bump-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
/* ズレ強調の注釈 */
.fig03 .gap-note {
  position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  font-size: 9px; color: #e8d9b0; white-space: nowrap;
  background: rgba(10,10,14,0.8); padding: 1px 6px; border-radius: 4px;
}
</style>
</head>
<body>
<h1>遊び方 — 図解モック</h1>

<!-- 01 -->
<div class="block">
  <div class="block-label">01</div>
  <div class="block-title">2つの部屋、1つの操作</div>
  <div class="fig01">
    <div class="mini-board g3">
      <div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="c"></div><div class="c w"></div><div class="c"></div>
      <div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="b"></div>
      <div class="gl" style="left:66%;top:66%"></div>
    </div>
    <div class="mini-board g3">
      <div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="c"></div><div class="c"></div><div class="c w"></div>
      <div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="b"></div>
      <div class="gl" style="left:2%;top:66%"></div>
    </div>
    <div class="dir-ind">→</div>
  </div>
  <div class="block-cap">スワイプひとつで、両方の球が同時に動く</div>
</div>

<hr>

<!-- 02 -->
<div class="block">
  <div class="block-label">02</div>
  <div class="block-title">同時にゴールへ</div>
  <div class="fig02">
    <div class="fig02-case">
      <div class="fig02-label ok">✓ クリア</div>
      <div class="fig02-pair">
        <div class="mini-board g3 ok-board1">
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="gl"></div><div class="b"></div>
        </div>
        <div class="mini-board g3 ok-board2">
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="gl"></div><div class="b"></div>
        </div>
      </div>
      <div class="block-cap">2球とも同時にゴール上</div>
    </div>
    <div class="fig02-case">
      <div class="fig02-label ng">✗ 反則</div>
      <div class="fig02-pair">
        <div class="mini-board g3 ng-board1">
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="gl"></div><div class="b"></div>
        </div>
        <div class="mini-board g3 ng-board2">
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="gl"></div><div class="b"></div>
        </div>
      </div>
      <div class="block-cap">片方だけゴール = 反則</div>
    </div>
  </div>
</div>

<hr>

<!-- 03 -->
<div class="block">
  <div class="block-label">03</div>
  <div class="block-title">壁がズレを生む</div>
  <div class="fig03">
    <div class="fig03-step">
      <div class="fig03-step-label">操作前</div>
      <div class="fig03-pair">
        <div class="mini-board g3 step1-b1">
          <div class="c"></div><div class="c w"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="b"></div>
        </div>
        <div class="mini-board g3 step1-b2">
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="b"></div>
        </div>
      </div>
      <div class="block-cap">同じ位置</div>
    </div>

    <div class="fig03-arrow">→</div>

    <div class="fig03-step">
      <div class="fig03-step-label">→ を入力</div>
      <div class="fig03-pair">
        <div class="mini-board g3 step2-b1">
          <div class="c"></div><div class="c w"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="b"></div>
          <div class="bump-mark"></div>
        </div>
        <div class="mini-board g3 step2-b2">
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="b"></div>
          <div class="gap-note">動いた!</div>
        </div>
      </div>
      <div class="block-cap">壁で止まる = ズレ発生</div>
    </div>
  </div>
</div>

</body>
</html>
