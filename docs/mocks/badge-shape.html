<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>残数バッジ 形状案: 丸 / 角丸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", system-ui, sans-serif; padding: 22px; background: #2a2a2e; color: #ddd; }
  h1 { font-size: 15px; font-weight: 400; margin-bottom: 14px; }
  .stage { border-radius: 16px; padding: 20px 16px; margin-bottom: 18px; }
  .stage.dark  { background: radial-gradient(120% 100% at 50% 0%, #101018, #0a0a0e 60%); color: #9d9a8e; }
  .stage.light { background: radial-gradient(120% 100% at 50% 0%, #fbf8f1, #f3efe6 60%); color: #8a8276; }
  .ptitle { font-size: 12px; letter-spacing:.1em; margin-bottom: 14px; opacity:.85; }
  .line { display:flex; align-items:center; gap:14px; margin-bottom: 14px; }
  .line .tag { width: 52px; font-size: 12px; opacity:.8; }
  .row { display: flex; gap: 12px; }

  .help { position: relative; font: inherit; font-size: 13px; letter-spacing:.04em;
    border-radius: 11px; padding: 11px 14px; }
  .stage.dark  .help { color:#d8d4ca; background:#121218; border:1px solid rgba(255,255,255,.08); }
  .stage.light .help { color:#2b2620; background:#fbf8f1; border:1px solid rgba(43,38,32,.14); }

  .badge { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; padding: 0 4px;
    font-size: 10px; font-weight: 700; line-height: 18px; text-align: center; }
  .badge.ad { font-weight: 400; font-size: 9px; }
  /* 色(テーマ別) */
  .stage.dark .badge  { background: #e8d9b0; color: #16161d; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
  .stage.light .badge { background: radial-gradient(120% 150% at 40% 22%, #fdf3d2 0%, #f0d990 45%, #d8b75f 100%);
    color: #5a4413; box-shadow: inset 0 1px 1px rgba(255,252,238,.85), inset 0 0 0 1px rgba(255,242,205,.5), 0 1px 2px rgba(80,58,18,.22); }
  /* 形状 */
  .round .badge { border-radius: 9px; }
  .rect  .badge { border-radius: 5px; }
</style>
</head>
<body>
  <h1>残数バッジ 形状案 — 丸 / 角丸（ライト=案Cコイン金 / ダーク=淡い金）</h1>
  <div id="root"></div>
  <script>
    const P='▶';
    const help=(l,b)=>`<button class="help">${l}<span class="badge ${b===P?'ad':''}">${b}</span></button>`;
    const row=(shape)=>`<div class="row ${shape}">${help('光ヒント','5')}${help('次の手ヒント','10')}${help('答え',P)}</div>`;
    const panel=(theme,name)=>`
      <div class="stage ${theme}">
        <div class="ptitle">${name}</div>
        <div class="line"><span class="tag">丸</span>${row('round')}</div>
        <div class="line"><span class="tag">角丸</span>${row('rect')}</div>
      </div>`;
    document.getElementById('root').innerHTML = panel('dark','ダーク') + panel('light','ライト');
  </script>
</body>
</html>
