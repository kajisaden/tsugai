<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tsugaiの作り方(解説動画の画面)</title>
<!-- 解説動画の全画面。window.seek(秒) で任意の時刻の絵を出す。render.mjs が1コマずつ撮影する。
     data.js / clips/ / node_modules は出力ディレクトリ側にあり、render.mjs がこのファイルをそこへコピーして開く。 -->
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/900.css">
<style>
:root{--bg:#fbf7ef;--ink:#232733;--sub:#6b7180;--line:#e2d9c8;--blue:#4f6bf0;--ball:#6ea6d8;--gold:#c9962a;--goldbg:#fbeecb;--board:#e9dcc6;--grid:#dccbb0;--wall:#f7ecda;--red:#d2533f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
#cap{position:absolute;left:160px;right:160px;bottom:34px;height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:42px;font-weight:700;line-height:1.42;letter-spacing:.01em}
#tag{position:absolute;left:44px;top:30px;font-size:24px;font-weight:700;color:var(--sub);display:flex;gap:14px;align-items:center}
#tag b{color:#fff;background:var(--blue);border-radius:8px;padding:2px 14px;font-weight:700}
.phone{position:absolute;border-radius:38px;overflow:hidden;background:#fbf7ef;box-shadow:0 0 0 7px #2b2f3a,0 24px 60px rgba(60,45,20,.22)}
.phone img{display:block;width:100%;height:100%}
.h1{font-size:112px;font-weight:900;letter-spacing:.02em;line-height:1.2}
.h2{font-size:64px;font-weight:900;line-height:1.3}
.h3{font-size:44px;font-weight:700;line-height:1.4}
.txt{font-size:36px;font-weight:500;line-height:1.5}
.sub{color:var(--sub)}.blue{color:var(--blue)}.gold{color:var(--gold)}.red{color:var(--red)}
.note{display:inline-block;font-size:36px;font-weight:700;border-radius:14px;padding:12px 26px;background:#fff;box-shadow:0 2px 0 var(--line)}
.note.g{background:var(--goldbg);color:#8a6410}
.qrow{display:flex;align-items:center;gap:26px;font-size:46px;font-weight:700;margin-bottom:34px}
.qrow i{font-style:normal;flex:none;width:70px;height:70px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900}
.chips{position:absolute;display:flex;gap:8px;justify-content:center}
.chip{width:108px;height:104px;border-radius:14px;background:#efe6d6;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.chip b{font-size:44px;line-height:1.1;font-weight:700}
.chip span{font-size:20px;font-weight:700;color:#8a6410;height:26px}
.chip em{position:absolute;top:-22px;right:-10px;font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}
.big{font-size:200px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.seqchip{display:inline-flex;min-width:92px;height:92px;border-radius:16px;background:#fff;box-shadow:0 2px 0 var(--line);align-items:center;justify-content:center;font-size:44px;font-weight:900;padding:0 14px;font-variant-numeric:tabular-nums}
.seqchip.first{background:var(--blue);color:#fff}
.row{display:flex;align-items:center;gap:14px}
.arrow{font-size:34px;color:var(--sub)}
svg text{font-family:"Noto Sans JP",sans-serif}
</style>
</head>
<body>
<div id="stage"><div id="tag"></div><div id="cap"></div></div>
<script src="data.js"></script>
<script>
'use strict';
const D = window.DATA, FPS = 30, ARW = ['↑', '↓', '←', '→'];
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const pr = (t, s, d = .5) => ease((t - s) / d);          // s秒から d秒かけて 0→1
const lin = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const pop = (x) => { x = clamp(x); return x === 0 ? 0 : 1 + 0.25 * Math.sin(x * Math.PI) * (1 - x) - (1 - x) * (1 - x); }; // ぽんと出る
function el(parent, cls, html = '', css = '') { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; if (css) e.style.cssText = css; parent.appendChild(e); return e; }
const at = (parent, x, y, cls, html = '', css = '') => el(parent, 'abs ' + cls, html, `left:${x}px;top:${y}px;` + css);
function show(e, p, dy = 24) { e.style.opacity = p; e.style.transform = `translateY(${(1 - p) * dy}px)`; }
function scale(e, p) { e.style.opacity = clamp(p * 3); e.style.transform = `scale(${pop(p)})`; }
const svgNS = 'http://www.w3.org/2000/svg';
function svg(parent, x, y, w, h, inner = '') { const s = document.createElementNS(svgNS, 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:visible`; s.innerHTML = inner; parent.appendChild(s); return s; }

// ---- ゲーム画面(録画コマ)を出すスマホ枠 ----
const pending = new Set();
function Phone(parent, x, y, h) {
  const w = Math.round(h * 390 / 844);
  const e = el(parent, 'phone', '<img alt="">', `left:${x}px;top:${y}px;width:${w}px;height:${h}px`);
  const img = e.firstChild; let cur = '';
  return { el: e, w, set(name, sec) {
    const n = clamp(Math.floor(sec * FPS), 0, D.clips[name].frames - 1);
    const src = `clips/${name}/f${String(n).padStart(5, '0')}.jpg`;
    if (src !== cur) { cur = src; img.src = src; pending.add(img); }
  } };
}
// ---- ゲームの盤に似せたSVGの盤 ----
function boardSVG(parent, x, y, size, puz, i) {
  const c = size / puz.w, r = puz.rooms[i], P = (k) => [(k % puz.w) * c, Math.floor(k / puz.w) * c];
  let s = `<rect width="${size}" height="${size}" rx="${c * .16}" fill="var(--board)"/>`;
  for (let k = 1; k < puz.w; k++) s += `<line x1="${k * c}" y1="6" x2="${k * c}" y2="${size - 6}" stroke="var(--grid)" stroke-width="2"/><line x1="6" y1="${k * c}" x2="${size - 6}" y2="${k * c}" stroke="var(--grid)" stroke-width="2"/>`;
  const tile = (k, cls, fill, extra = '') => { const [px, py] = P(k); return `<rect class="${cls}" x="${px + c * .13}" y="${py + c * .13}" width="${c * .74}" height="${c * .74}" rx="${c * .14}" fill="${fill}" ${extra} style="transform-box:fill-box;transform-origin:center"/>`; };
  for (const k of r.walls) s += tile(k, 'wall', 'var(--wall)', 'stroke="#d9c6a6" stroke-width="2"');
  s += tile(r.goal, 'goal', 'none', 'stroke="#3f86c2" stroke-width="5"');
  s += `<g class="glows"></g>` + tile(r.start, 'ball', 'var(--ball)', 'stroke="#4d8bc0" stroke-width="2"');
  const e = svg(parent, x, y, size, size, s);
  return { el: e, c, P, walls: [...e.querySelectorAll('.wall')], goal: e.querySelector('.goal'), ball: e.querySelector('.ball'), glows: e.querySelector('.glows'),
    moveBall(k0, k1, p) { const [a, b] = P(k0), [a2, b2] = P(k1), [sx, sy] = P(r.start); this.ball.style.transform = `translate(${lerp(a, a2, p) - sx}px,${lerp(b, b2, p) - sy}px)`; } };
}
// ---- 場面の地図(14×14の点) ----
function stateMap(parent, x, y, sp) {
  const n = D.free[0].length, m = D.free[1].length, xy = (pos) => [D.free[0].indexOf(pos[0]) * sp + sp / 2, D.free[1].indexOf(pos[1]) * sp + sp / 2];
  let s = '';
  for (let a = 0; a < n; a++) for (let b = 0; b < m; b++) s += `<circle cx="${a * sp + sp / 2}" cy="${b * sp + sp / 2}" r="${sp * .09}" fill="#d8cdb8"/>`;
  s += '<g class="edges"></g><g class="dots"></g><g class="top"></g>';
  const e = svg(parent, x, y, n * sp, m * sp, s);
  const lab = el(parent, 'abs sub', '', `left:${x}px;top:${y + m * sp + 8}px;width:${n * sp}px;text-align:center;font-size:24px;font-weight:700`); lab.textContent = '上のボールの位置 →';
  const lab2 = el(parent, 'abs sub', '', `left:${x - 46}px;top:${y + m * sp}px;width:${m * sp}px;text-align:center;font-size:24px;font-weight:700;transform-origin:0 0;transform:rotate(-90deg)`); lab2.textContent = '下のボールの位置 →';
  const mk = (g, tag, attrs) => { const c = document.createElementNS(svgNS, tag); for (const k in attrs) c.setAttribute(k, attrs[k]); e.querySelector(g).appendChild(c); return c; };
  return { el: e, labs: [lab, lab2], xy, sp,
    dot(pos, fill, r = .3) { const [cx, cy] = xy(pos); return mk('.dots', 'circle', { cx, cy, r: sp * r, fill, style: 'transform-box:fill-box;transform-origin:center' }); },
    topDot(pos, fill, r = .36) { const [cx, cy] = xy(pos); return mk('.top', 'circle', { cx, cy, r: sp * r, fill, style: 'transform-box:fill-box;transform-origin:center' }); },
    edge(p0, p1, stroke, w = 6) { const [a, b] = xy(p0), [c, d] = xy(p1); const l = mk('.edges', 'line', { x1: a, y1: b, x2: c, y2: d, stroke, 'stroke-width': w, 'stroke-linecap': 'round' }); l._len = Math.hypot(c - a, d - b); l.setAttribute('stroke-dasharray', l._len); return l; } };
}
const drawLine = (l, p) => l.setAttribute('stroke-dashoffset', l._len * (1 - clamp(p)));
const depthColor = (d, max) => `hsl(${lerp(228, 200, d / max)} ${lerp(85, 70, d / max)}% ${lerp(60, 80, d / max)}%)`;
function chipsRow(parent, cx, y, steps) {
  const row = el(parent, 'chips', '', `left:${cx - 420}px;top:${y}px;width:840px`);
  return steps.map((s) => { const who = s.blocked[0] ? '上が止まる' : s.blocked[1] ? '下が止まる' : ''; const c = el(row, 'chip', `<b>${ARW[s.d]}</b><span>${who}</span>` + (s.isNew ? `<em>${s.ep}</em>` : '')); c._s = s; return c; });
}
function paintChip(c, on, badge) { const hit = c._s.blocked.some(Boolean); c.style.opacity = on ? 1 : .28; c.style.background = on && hit ? 'var(--goldbg)' : '#efe6d6'; c.querySelector('span').style.opacity = on ? 1 : 0; const em = c.querySelector('em'); if (em) scale(em, badge); }

// ================= シーン定義 =================
const SCENES = {};
const scene = (id, build, draw) => { SCENES[id] = { id, build, draw }; };
const clipT = (i) => (D.START + i * D.STEP) / 1000; // i手目が始まるクリップ内の秒

scene('intro', (r) => {
  const ph = Phone(r, 250, 50, 860);
  const title = at(r, 800, 300, 'h1', 'Tsugai の<br>作り方');
  const subt = at(r, 806, 620, 'h3 sub', 'この問題は、だれが作った?');
  const n1 = at(r, 800, 330, 'note g', '上の盤: 外枠にぶつかって止まる');
  const n2 = at(r, 800, 450, 'note', '下の盤: そのまま1マス進む');
  const n3 = at(r, 800, 600, 'txt sub', '位置のずれを作る方法は、これだけ');
  const cnt = at(r, 800, 250, 'big blue num', '0'), cu = at(r, 800, 470, 'h2', '問、すべて機械が作った');
  const cs = at(r, 806, 590, 'txt sub', '通常 200問 ・ 上級 200問 ・ 3面 200問');
  const qs = at(r, 800, 270, '', ['難易度をどう調整するの?', '機械的に問題を作るには?', '光ヒントはどういう仕組み?'].map((q, i) => `<div class="qrow"><i>${i + 1}</i>${q}</div>`).join(''));
  return { ph, title, subt, n1, n2, n3, cnt, cu, cs, qs };
}, (e, { step, tau }) => {
  e.ph.set('intro', step === 0 ? tau - 1.2 : step === 1 ? tau - 0.6 : 99);
  const o0 = step === 0 ? pr(tau, .3) : 0;
  show(e.title, o0); show(e.subt, step === 0 ? pr(tau, 1.0) : 0);
  const b = clipT(1) + 0.6; // 2手目=上の盤が止まる
  show(e.n1, step === 1 ? pr(tau, b) : 0); show(e.n2, step === 1 ? pr(tau, b + .5) : 0); show(e.n3, step === 1 ? pr(tau, b + 1.6) : 0);
  const o2 = step === 2 ? pr(tau, .2) : 0;
  show(e.cnt, o2); e.cnt.textContent = Math.round(600 * ease(lin(tau, .3, 1.6)));
  show(e.cu, step === 2 ? pr(tau, 1.6) : 0); show(e.cs, step === 2 ? pr(tau, 2.4) : 0);
  [...e.qs.children].forEach((q, i) => show(q, step === 3 ? pr(tau, .4 + i * .9) : 0));
  e.qs.style.opacity = step === 3 ? 1 : 0;
});

const QTITLES = ['難易度をどう調整するの?', '機械的に問題を作るには?', '光ヒントはどういう仕組み?'];
[1, 2, 3].forEach((n) => scene('t' + n, (r) => {
  const a = el(r, 'abs', `<div class="h3 blue" style="font-weight:900;letter-spacing:.2em">疑問 ${n}</div><div class="h1" style="font-size:104px;margin-top:20px">${QTITLES[n - 1]}</div>`, 'left:0;right:0;top:340px;text-align:center');
  const bar = el(r, 'abs', '', 'left:860px;top:640px;width:200px;height:8px;border-radius:4px;background:var(--blue);transform-origin:center');
  return { a, bar };
}, (e, { tau }) => { show(e.a, pr(tau, .15, .6), 40); e.bar.style.transform = `scaleX(${pr(tau, .5, .7)})`; }));

scene('q1', (r) => {
  const pL = Phone(r, 480 - 148, 84, 640), pR = Phone(r, 1440 - 148, 84, 640);
  const cL = chipsRow(r, 480, 760, D.simE), cR = chipsRow(r, 1440, 760, D.simH);
  const mk = (cx, ep) => { const w = el(r, 'abs row', `<span class="h3">7手</span><span class="h3 blue k" style="margin-left:26px">気づき ${ep}</span>`, `left:${cx - 300}px;top:880px;width:600px;justify-content:center`); return w; };
  const sL = mk(480, 1), sR = mk(1440, 3);
  const vs = at(r, 900, 330, 'h2 sub', '');
  return { pL, pR, cL, cR, sL, sR, vs };
}, (e, { step, tau, T }) => {
  const ct = step === 0 ? tau - 1.0 : 99;
  e.pL.set('exE', ct); e.pR.set('exH', ct);
  for (const [chips] of [[e.cL], [e.cR]]) chips.forEach((c, i) => {
    const on = step > 0 || ct >= clipT(i);
    const k = chips.filter((x, j) => j <= i && x._s.isNew).length; // この手までの気づき番号
    paintChip(c, on, step === 3 ? lin(tau, .8 + k * .8, .4) : step > 3 ? 1 : 0);
  });
  for (const s of [e.sL, e.sR]) { show(s.firstChild, step >= 2 ? (step === 2 ? pr(tau, .3) : 1) : 0); show(s.querySelector('.k'), step === 3 ? pr(tau, 4.0) : 0); }
});

scene('dp', (r) => {
  const W = 6, H = 5, c = 116, x0 = 150, y0 = 170;
  let s = '';
  for (let k = 0; k < W * H; k++) { const x = k % W, y = (k - x) / W; s += `<rect class="cell" x="${x * c + 5}" y="${y * c + 5}" width="${c - 10}" height="${c - 10}" rx="14" fill="#efe6d6"/><text class="n" x="${x * c + c / 2}" y="${y * c + c / 2 + 16}" text-anchor="middle" font-size="44" font-weight="900" fill="var(--ink)"></text>`; }
  s += '<polyline class="path" fill="none" stroke="var(--blue)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>';
  const g = svg(r, x0, y0, W * c, H * c, s);
  const dp = []; for (let k = 0; k < W * H; k++) { const x = k % W, y = (k - x) / W; dp[k] = (!x || !y) ? 1 : dp[k - 1] + dp[k - W]; }
  // でたらめな道(右か下)を決まった乱数で何本か用意
  let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const paths = Array.from({ length: 14 }, () => { const m = [...'RRRRRDDDD'].sort(() => rnd() - .5); let x = 0, y = 0; const pts = [[c / 2, c / 2]]; for (const ch of m) { if (ch === 'R') x++; else y++; pts.push([x * c + c / 2, y * c + c / 2]); } return pts; });
  const sLab = at(r, x0, y0 - 64, 'txt sub', 'スタート'), gLab = at(r, x0 + W * c - 110, y0 + H * c + 8, 'txt sub', 'ゴール');
  const q = at(r, 960, 250, 'h2', '道は何通り?'), cnt = at(r, 960, 360, 'big blue num', '', 'font-size:150px');
  const f = at(r, 960, 250, 'h2', '<span class="blue">左</span> + <span class="blue">上</span> = このマス'), f2 = at(r, 960, 360, 'txt sub', '手前の答えを書きとめて、使い回す');
  const res = at(r, 960, 470, 'h3', `右下まで <span class="blue" style="font-size:72px;font-weight:900">${dp[W * H - 1]}</span> 通り`);
  const name = at(r, 960, 220, 'h1', '動的計画法', 'font-size:96px'), use = at(r, 964, 400, 'txt', '<span class="note">Tsugaiでは</span><br><br>各場面に「ここまでの気づきの最小」を<br>書きとめて、次の場面の計算に使う');
  return { g, W, H, c, dp, paths, q, cnt, f, f2, res, name, use, sLab, gLab, cells: [...g.querySelectorAll('.cell')], nums: [...g.querySelectorAll('.n')], path: g.querySelector('.path') };
}, (e, { step, tau }) => {
  const { W, H } = e;
  // step0: 道を1本ずつ引いて数える
  const per = .42, i = Math.floor((tau - .8) / per), ok = step === 0 && i >= 0 && i < e.paths.length;
  if (ok) { const pts = e.paths[i], p = lin((tau - .8) % per, 0, per * .8), n = Math.max(2, Math.ceil(p * pts.length)); e.path.setAttribute('points', pts.slice(0, n).map((q) => q.join(',')).join(' ')); }
  e.path.style.opacity = ok ? 1 : 0;
  show(e.q, step === 0 ? pr(tau, .3) : 0); show(e.cnt, step === 0 ? 1 : 0);
  e.cnt.textContent = step === 0 ? (i < 0 ? '' : i >= e.paths.length ? '…?' : (i + 1) + '…') : '';
  // step1: 斜めの列ごとに数を書きこむ
  e.nums.forEach((n, k) => { const x = k % W, y = (k - x) / W, t0 = 1.0 + (x + y) * .55; const on = step > 1 || (step === 1 && tau >= t0); n.textContent = on ? e.dp[k] : ''; const hot = step === 1 && tau >= t0 && tau < t0 + .55; e.cells[k].setAttribute('fill', hot ? 'var(--goldbg)' : (on ? '#fff' : '#efe6d6')); });
  show(e.f, step === 1 ? pr(tau, .3) : 0); show(e.f2, step === 1 ? pr(tau, 1.2) : 0); show(e.res, step === 1 ? pr(tau, 1.0 + (W + H - 2) * .55 + .3) : 0);
  show(e.name, step === 2 ? pr(tau, .3) : 0); show(e.use, step === 2 ? pr(tau, 1.4) : 0);
});

scene('curve', (r) => {
  const x0 = 150, y0 = 190, bw = 6.1, H = 560, maxEp = 4;
  let s = '';
  for (let k = 0; k <= maxEp; k++) s += `<line x1="0" x2="${200 * bw}" y1="${H - k * H / maxEp}" y2="${H - k * H / maxEp}" stroke="var(--line)" stroke-width="2"/><text x="-18" y="${H - k * H / maxEp + 10}" text-anchor="end" font-size="28" font-weight="700" fill="var(--sub)">${k}</text>`;
  D.curve.forEach((c, i) => { const hh = Math.max(4, c.ep * H / maxEp); s += `<rect class="b" x="${i * bw}" y="${H - hh}" width="${bw - 1.4}" height="${hh}" fill="${c.boss ? 'var(--gold)' : 'var(--blue)'}" style="transform-box:fill-box;transform-origin:bottom"/>`; });
  for (const n of [1, 50, 100, 150, 200]) s += `<text x="${(n - .5) * bw}" y="${H + 40}" text-anchor="middle" font-size="28" font-weight="700" fill="var(--sub)">${n}</text>`;
  const g = svg(r, x0, y0, 200 * bw, H + 60, s);
  at(r, x0 - 40, y0 - 66, 'txt sub', '気づきの数', 'font-size:28px;font-weight:700'); at(r, x0 + 200 * bw - 220, y0 + H + 62, 'txt sub', 'レベル(通常モード)', 'font-size:28px;font-weight:700');
  const leg = at(r, x0 + 420, y0 - 70, 'row txt', '<span style="width:28px;height:28px;border-radius:6px;background:var(--gold);display:inline-block"></span><span style="font-size:30px;font-weight:700">10問ごとの山場</span>');
  const ph = Phone(r, 1500, 110, 760), pl = at(r, 1500, 884, 'txt sub', 'レベル10(山場)', `width:${ph.w}px;text-align:center;font-size:28px;font-weight:700`);
  return { bars: [...g.querySelectorAll('.b')], leg, ph, pl };
}, (e, { step, tau }) => {

const TAGS = { q1: 1, dp: 1, curve: 1, gen: 2, rng: 2, state: 2, maze: 2, bfsmap: 2, foul: 2, mass: 2, hint: 3 };

// シーンの実体を作り、時刻表を組む
const runs = []; let acc = 0;
BEATS.forEach(([id, dur, cap], i) => {
  let run = runs[runs.length - 1];
  if (!run || run.id !== id) { const root = el(stage, 'scene'); run = { id, root, start: acc, steps: [], els: SCENES[id].build(root) }; runs.push(run); }
  run.steps.push({ start: acc, dur, cap }); acc += dur; run.end = acc;
});
window.DURATION = acc;
const capEl = document.getElementById('cap'), tagEl = document.getElementById('tag');
stage.appendChild(tagEl); stage.appendChild(capEl);
const FADE = .35;
window.seek = async (t) => {
  t = clamp(t, 0, acc - 1e-6);
  for (const run of runs) {
    const inRun = t >= run.start && t < run.end;
    if (!inRun) { run.root.style.opacity = 0; run.root.style.visibility = 'hidden'; continue; }
    run.root.style.visibility = 'visible';
    run.root.style.opacity = Math.min(lin(t, run.start, FADE), run === runs[runs.length - 1] ? 1 : lin(run.end - t, 0, FADE));
    let step = run.steps.findIndex((s) => t >= s.start && t < s.start + s.dur); const s = run.steps[step];
    SCENES[run.id].draw(run.els, { step, tau: t - s.start, T: t - run.start });
    const next = run.steps[step + 1];
    capEl.innerHTML = s.cap; capEl.style.opacity = Math.min(lin(t, s.start + .1, .3), lin(s.start + s.dur - t, 0, .25) + (next && next.cap === s.cap ? 1 : 0));
    const n = TAGS[run.id]; tagEl.innerHTML = n ? `<b>疑問 ${n}</b>${QTITLES[n - 1]}` : ''; tagEl.style.opacity = n ? lin(t, run.start, FADE) : 0;
  }
  const waits = [...pending].map((img) => img.decode().catch(() => {})); pending.clear();
  await Promise.all(waits); await document.fonts.ready;
};
window.BEAT_STARTS = runs.flatMap((r) => r.steps.map((s) => s.start));
